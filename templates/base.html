<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Traffic Management{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🚦 Smart Traffic Management</div>
    <nav>
      <a href="/" class="{{ 'active' if request.path == '/' }}">Live</a>
      <a href="/history" class="{{ 'active' if request.path == '/history' }}">History</a>
      <a href="/compare" class="{{ 'active' if request.path == '/compare' }}">Model comparison</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
