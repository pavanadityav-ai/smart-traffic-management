name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests use a fake detector, so YOLO and torch are not needed here
      - run: pip install flask numpy opencv-python-headless requests pytest
      - run: python -m pytest -q
